# Entorno Hatch para el tagger
[tool.hatch.envs.tagger]
python = "3.12"
skip-install = true
dependencies = [
    "numpy==2.5.1",
    "onnxruntime-gpu==1.23.2",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "tqdm==4.69.0",
    "huggingface-hub==1.24.0",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cudnn-cu12==9.25.0.15",
]

[tool.hatch.envs.tagger.scripts]
tag = "python tag_images.py {args}"

check = """
python -c "import onnxruntime as ort; print('ONNX Runtime:', ort.__version__); print('Providers:', ort.get_available_providers())"
"""


# Entorno Hatch para el extractor
[tool.hatch.envs.crop]
python = "3.12"
skip-install = true
dependencies = [
    "numpy==2.5.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics>=8.4.104",
    "gitpython>=3.1.30",
    "opencv-python-headless>=5.0.0.93",
    "PyQt6>=6.11.0",
    "setuptools<81",
    "tqdm==4.69.0",
    "pandas==3.0.3",
    "seaborn>=0.13.2",
    "scipy>=1.18.0",

]

[tool.hatch.envs.crop.scripts]
crop = "python test_crop.py {args}"

check = """
python -c "import torch; print('Torch:', torch.__version__); print('CUDA:', torch.version.cuda); print('cuDNN:', torch.backends.cudnn.version()); print('CUDA disponible:', torch.cuda.is_available()); print('GPU:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'ninguna')"
"""